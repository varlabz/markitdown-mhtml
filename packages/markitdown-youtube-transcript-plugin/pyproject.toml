[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markitdown-youtube-transcript"
dynamic = ["version"]
description = 'A MarkItDown plugin that converts YouTube videos to Markdown using their transcripts.'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "MarkItDown Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "markitdown>=0.1.0a1",
  "yt-dlp",
]

[project.urls]
Documentation = "https://github.com/microsoft/markitdown#readme"
Issues = "https://github.com/microsoft/markitdown/issues"
Source = "https://github.com/microsoft/markitdown"

[tool.hatch.version]
path = "src/markitdown_youtube_transcript/__about__.py"

[project.scripts]
markitdown-yt = "markitdown_youtube_transcript.__main__:main"

# IMPORTANT: MarkItDown will look for this entry point to find the plugin.
[project.entry-points."markitdown.plugin"]
youtube_transcript = "markitdown_youtube_transcript"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/markitdown_youtube_transcript tests}"

[tool.coverage.run]
source_pkgs = ["markitdown_youtube_transcript", "tests"]
branch = true
parallel = true
omit = [
  "src/markitdown_youtube_transcript/__about__.py",
]

[tool.coverage.paths]
markitdown-youtube-transcript = ["src/markitdown_youtube_transcript", "*/markitdown-youtube-transcript/src/markitdown_youtube_transcript"]
tests = ["tests", "*/markitdown-youtube-transcript/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.sdist]
only-include = ["src/markitdown_youtube_transcript"]
